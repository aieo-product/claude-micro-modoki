# unittest を macOS ランナーで実行する CI (#80)。
# GET / (console 配信) の回帰は tests/test_frozen_paths.py がスイート内で検証する。
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install aiohttp hidapi
      - name: Run tests
        run: python -m unittest discover -s tests
